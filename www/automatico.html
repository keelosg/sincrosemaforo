    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --elev-bg: #2a2a2a;
            --border: #333333;
            --text: #ffffff;
            --dim: #aaaaaa;
            --accent: #00e676;
            --btn-bg: #333333;
            --btn-fg: #ffffff;
        }
        body.light {
            --bg: #f4f5f7;

        }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 100px; text-align: center; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 1.2em; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-back { background: var(--btn-bg); color: var(--btn-fg); }
        .btn-go { background: var(--accent); color: #000; }
        textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--elev-bg); color: var(--text); font-size: 1em; min-height: 200px; font-family: Consolas, monospace; }
        #cameraView { margin-top: 10px; }
    </style>
</head>
