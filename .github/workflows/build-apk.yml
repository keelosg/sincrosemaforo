name: Build APK

on:
  push:
    branches: [ main, prueba-cambios ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install Capacitor Assets
        run: npm install -D @capacitor/assets

      - name: Generate app icon
        run: npx capacitor-assets generate --android

      - name: Patch AndroidManifest (vibración + lock screen)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST"
          sed -i 's/android:name="\.MainActivity"/android:name=".MainActivity"\n            android:showWhenLocked="true"\n            android:turnScreenOn="true"/' "$MANIFEST"
          cat "$MANIFEST"

      - name: Patch MainActivity (fallback pantallas viejas, API < 27)
        run: |
          MAIN=android/app/src/main/java/com/sincrosemaforo/miapp/MainActivity.java
          python3 -c "path='$MAIN'; c=open(path).read(); insert='\n    if (android.os.Build.VERSION.SDK_INT >= 27) {\n        setShowWhenLocked(true);\n        setTurnScreenOn(true);\n    } else {\n        getWindow().addFlags(\n            android.view.WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |\n            android.view.WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |\n            android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n    }\n'; c=c.replace('super.onCreate(savedInstanceState);','super.onCreate(savedInstanceState);'+insert,1); open(path,'w').write(c)"
          cat "$MAIN"

      - name: Sync Capacitor
        run: npx cap sync

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
