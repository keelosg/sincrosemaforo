name: Build APK

on:
  push:
    branches: [ main, prueba-cambios ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon
        run: npx @capacitor/assets generate --android

      - name: Patch AndroidManifest (vibración + lock screen)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST"
          sed -i 's/android:name="\.MainActivity"/android:name=".MainActivity"\n            android:showWhenLocked="true"\n            android:turnScreenOn="true"\n            android:keepScreenOn="true"/' "$MANIFEST"
          cat "$MANIFEST"

      - name: Patch MainActivity (mostrar sobre lock screen + bloquear toda interacción)
        run: |
          MAIN=$(find android/app/src/main/java -name "MainActivity.java")
          echo "MainActivity encontrado en: $MAIN"
          python3 - "$MAIN" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          content = open(path).read()
          m = re.search(r'^package\s+([\w.]+);', content, re.MULTILINE)
          pkg = m.group(1) if m else 'com.sincrosemaforo.miapp'

          plantilla = '''package __PKG__;

          import android.app.KeyguardManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.MotionEvent;

          import androidx.lifecycle.Lifecycle;
          import androidx.lifecycle.LifecycleEventObserver;
          import androidx.lifecycle.LifecycleOwner;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private volatile boolean pantallaBloqueada = false;

              private final BroadcastReceiver lockReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      String action = intent.getAction();
                      if (Intent.ACTION_SCREEN_OFF.equals(action)) {
                          setPantallaBloqueada(true);
                      } else if (Intent.ACTION_SCREEN_ON.equals(action) || Intent.ACTION_USER_PRESENT.equals(action)) {
                          setPantallaBloqueada(estaElMovilBloqueado(context));
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(
                          android.view.WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                          android.view.WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |
                          android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  }

                  pantallaBloqueada = estaElMovilBloqueado(this);

                  IntentFilter filter = new IntentFilter();
                  filter.addAction(Intent.ACTION_SCREEN_OFF);
                  filter.addAction(Intent.ACTION_SCREEN_ON);
                  filter.addAction(Intent.ACTION_USER_PRESENT);
                  try {
                      registerReceiver(lockReceiver, filter);
                  } catch (Exception ignored) {
                  }

                  getLifecycle().addObserver(new LifecycleEventObserver() {
                      @Override
                      public void onStateChanged(LifecycleOwner source, Lifecycle.Event event) {
                          if (event == Lifecycle.Event.ON_RESUME) {
                              setPantallaBloqueada(estaElMovilBloqueado(MainActivity.this));
                          } else if (event == Lifecycle.Event.ON_DESTROY) {
                              try {
                                  unregisterReceiver(lockReceiver);
                              } catch (Exception ignored2) {
                              }
                          }
                      }
                  });
              }

              @Override
              public boolean dispatchTouchEvent(MotionEvent ev) {
                  // Mientras el móvil esté bloqueado se descartan TODOS los toques:
                  // la única salida es desbloquear el teléfono.
                  if (pantallaBloqueada) {
                      return true;
                  }
                  return super.dispatchTouchEvent(ev);
              }

              private boolean estaElMovilBloqueado(Context context) {
                  KeyguardManager km = (KeyguardManager) context.getSystemService(Context.KEYGUARD_SERVICE);
                  if (km == null) return false;
                  if (Build.VERSION.SDK_INT >= 23) {
                      return km.isDeviceLocked();
                  }
                  return km.isKeyguardLocked();
              }

              private void setPantallaBloqueada(boolean bloqueada) {
                  pantallaBloqueada = bloqueada;
                  try {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          final String js = "window.sincroScreenLocked = " + bloqueada + ";";
                          getBridge().getWebView().post(new Runnable() {
                              @Override
                              public void run() {
                                  getBridge().getWebView().evaluateJavascript(js, null);
                              }
                          });
                      }
                  } catch (Exception ignored) {
                  }
              }
          }
          '''

          open(path, 'w').write(plantilla.replace('__PKG__', pkg))
          print('MainActivity.java generado con bloqueo de interaccion en lock screen')
          PYEOF
          cat "$MAIN"

      - name: Sync Capacitor
        run: npx cap sync

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renombrar APK con el nombre del build
        run: |
          BUILDDIR=android/app/build/outputs/apk/debug
          mv "$BUILDDIR/app-debug.apk" "$BUILDDIR/app-debug-build-${{ github.run_number }}.apk"
          ls -la "$BUILDDIR"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-build-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug-build-${{ github.run_number }}.apk
