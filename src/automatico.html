<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo Calibración 3 Zonas</title>
<style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    html, body { height: 100%; }
    body { background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* ===== Zona superior: cámara, ocupa el espacio restante (~2/3) ===== */
    .camara-zone { flex: 2 1 0; min-height: 0; position: relative; background: #000; }
    .video-wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    h2 { position: absolute; top: 8px; left: 56px; right: 12px; margin: 0; font-size: 0.95em; text-shadow: 0 1px 4px rgba(0,0,0,0.9); z-index: 2; }
    .sub { position: absolute; top: 32px; left: 56px; right: 12px; font-size: 0.7em; color: #ddd; text-shadow: 0 1px 4px rgba(0,0,0,0.9); z-index: 2; }
    .btn-atras { position: absolute; top: 8px; left: 8px; z-index: 3; width: 40px; height: 40px; padding: 0; margin: 0; border-radius: 50%; font-size: 1.1em; background: rgba(20,20,20,0.7); color: #fff; border: 1px solid #444; }
    .zoom-btns { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); z-index: 3; display: none; flex-direction: column; align-items: center; gap: 6px; }
    .zoom-btn { width: 40px; height: 40px; padding: 0; margin: 0; border-radius: 50%; font-size: 1.4em; font-weight: 700; background: rgba(20,20,20,0.7); color: #fff; border: 1px solid #444; }
    .zoom-nivel { font-size: 0.65em; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }

    .estado-chip { position: absolute; bottom: 10px; left: 10px; z-index: 3; font-size: 0.78em; font-weight: 800; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.95); background: rgba(20,20,20,0.6); padding: 6px 10px; border-radius: 999px; }

    /* ===== Zona inferior: controles, fijada a ~1/3 de la pantalla con scroll ===== */
    .controles-zone { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 10px 12px; }

    .card { background: #1e1e1e; padding: 10px; border-radius: 10px; margin-top: 8px; text-align: left; }
    button { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 0.9em; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row button { margin-top: 0; }
    .btn-start { background: #00e676; color: #000; }
    .btn-stop { background: #d32f2f; color: #fff; }
    .btn-start:disabled, .btn-stop:disabled { opacity: 0.4; }
    .status { margin-top: 8px; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; font-size: 0.9em; }
    .status-idle { background: #2a2a2a; color: #aaa; }
    .status-calibrando { background: rgba(41,121,255,0.15); color: #2979ff; }
    .status-esperando { background: rgba(255,193,7,0.15); color: #ffc107; }
    .status-sync { background: rgba(0,230,118,0.15); color: #00e676; }
    .zonas { display: flex; gap: 6px; margin-top: 8px; }
    .zona { flex: 1; text-align: center; padding: 6px; border-radius: 8px; background: #2a2a2a; }
    .zona .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-bottom: 3px; background: #333; }
    .zona.on-rojo .dot { background: #d32f2f; box-shadow: 0 0 8px #d32f2f; }
    .zona.on-amarillo .dot { background: #fbc02d; box-shadow: 0 0 8px #fbc02d; }
    .zona.on-verde .dot { background: #388e3c; box-shadow: 0 0 8px #388e3c; }
    .zona .lbl { font-size: 0.65em; color: #888; display: block; }
    .medidas { display: flex; gap: 6px; margin-top: 6px; }
    .medida { flex: 1; text-align: center; padding: 4px 6px; border-radius: 8px; background: #1a1a1a; font-size: 0.72em; color: #aaa; }
    .medida .val { font-size: 1.2em; font-weight: 800; color: #fff; font-family: Consolas, monospace; }
    .medida .lbl { font-size: 0.6em; color: #666; display: block; }
    .log { font-size: 0.68em; color: #888; margin-top: 6px; max-height: 70px; overflow-y: auto; text-align: left; line-height: 1.4; }
    .resultado table { width: 100%; border-collapse: collapse; font-size: 0.82em; margin-top: 6px; }
    .resultado td { padding: 4px; border-bottom: 1px solid #333; }
    .resultado td:first-child { font-weight: bold; }
    .nota { font-size: 0.68em; color: #666; margin-top: 8px; }
    .copiable { background: #2a2a2a; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 0.72em; margin-top: 6px; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="camara-zone">
    <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <button class="btn-atras" onclick="window.location.href='index.html'">‹</button>
    <h2>🔵 Calibración: apunta y espera</h2>
    <div class="sub">Mete la luz del semáforo dentro del recuadro (no hace falta exactitud)</div>
    <div class="zoom-btns" id="zoomBtns">
        <button class="zoom-btn" onclick="cambiarZoom(1)">+</button>
        <div class="zoom-nivel" id="zoomNivel">×1.0</div>
        <button class="zoom-btn" onclick="cambiarZoom(-1)">−</button>
        <div class="zoom-nivel">Zona</div>
        <button class="zoom-btn" id="btnZona" onclick="cambiarTamanoZona()">⟦⟧ M</button>
    </div>
    <div class="estado-chip" id="chipEstable">🟠 Buscando semáforo…</div>
</div>

<div class="controles-zone">
    <div class="zonas">
        <div class="zona" id="zonaRojo"><div class="dot"></div><span class="lbl">ROJO</span></div>
        <div class="zona" id="zonaAmarillo"><div class="dot"></div><span class="lbl">AMARILLO</span></div>
        <div class="zona" id="zonaVerde"><div class="dot"></div><span class="lbl">VERDE</span></div>
    </div>

    <div class="medidas">
        <div class="medida"><span class="lbl">ROJO</span><div class="val" id="medRojo">--</div></div>
        <div class="medida"><span class="lbl">AMARILLO</span><div class="val" id="medAmarillo">--</div></div>
        <div class="medida"><span class="lbl">VERDE</span><div class="val" id="medVerde">--</div></div>
    </div>

    <div class="btn-row">
        <button id="btnStop" class="btn-stop" onclick="detener()">✖ Cancelar y volver</button>
    </div>

    <div id="status" class="status status-idle">Iniciando cámara...</div>

    <div class="card">
        <label style="font-size:0.75em;color:#aaa;">Detecciones</label>
        <div class="log" id="log">Encuadra el semáforo...</div>
    </div>

    <div id="resultadoCard" class="card" style="display:none;">
        <label style="font-size:0.75em;color:#aaa;">Ciclo calculado</label>
        <div class="resultado" id="resultadoTabla"></div>
        <div class="nota">Sincronizado correctamente. Volviendo a la vista con el temporizador...</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const statusBox = document.getElementById('status');
    const logBox = document.getElementById('log');
    const resultadoCard = document.getElementById('resultadoCard');
    const resultadoTabla = document.getElementById('resultadoTabla');
    const copiableBox = document.getElementById('copiable');
    const zonaEls = { rojo: document.getElementById('zonaRojo'), amarillo: document.getElementById('zonaAmarillo'), verde: document.getElementById('zonaVerde') };

    let stream = null;
    let rafId = null;
    let historialFase = [];
    const TAMANO_HISTORIAL = 6;
    let faseConfirmadaActual = null;
    let ultimoGlitch = 0;
    let ultimaDeteccion = 0;
    let vecesAnclaVista = 0;
    // Instante del PRIMER frame en que el color cambió (previo a confirmar).
    // Así las transiciones y el syncTime quedan pegados al cambio REAL de la luz
    // y no a la demora de estabilidad (~0.3s), eliminando el delay tras sincronizar.
    let inicioTransicion = null;

    // Tamaños de zona de detección: [fracción ancho, fracción alto] del overlay
    // Zonas rectangulares [ancho, alto] en fracción de pantalla: más alta que
    // ancha para aislar la columna del semáforo sin captar luces vecinas.
    const TAMANOS_ZONA = [[0.22, 0.32], [0.28, 0.42], [0.36, 0.52]];
    let nivelZona = 1;
    const NOMBRES_ZONA = ['S', 'M', 'G'];

    // Zoom nativo de la cámara (si el dispositivo lo soporta)
    let trackZoom = null;
    let zoomActual = 1;
    let zoomMin = 1;
    let zoomMax = 1;
    let zoomPaso = 0.1;
    let ultimoAutoZoom = 0;

    // Estados: 'idle' | 'calibrando' | 'esperando_fin_verde' | 'sincronizado'
    let appState = 'idle';

    // Detección de ciclo por color de referencia:
    // 1. Al abrir la cámara se fija el primer color detectado (faseAncla).
    // 2. El ciclo se completa cuando ese color vuelve a aparecer.
    // 3. Se sincroniza cuando termina el VERDE.
    let faseAncla = null;          // color de referencia (el primero detectado)
    let tAncla = null;             // instante de la primera detección (referencia parcial)
    let faseActual = null;         // fase actual (avanza con transiciones estables)
    let inicioFaseActual = null;   // instante en que empezó la fase actual
    let duracionesFase = {};       // duración (ms) por fase del último segmento completo
    let ordenCiclo = [];           // orden en que se observaron las fases
    let cicloCerrado = false;      // ya se observó el color de referencia volver
    let historialDuraciones = {};  // fase -> [ms observadas] (para promediar y ganar precisión)
    let conteoFin = {};            // fase -> nº de veces que se ha visto terminar

    const eventLog = [];

    function rgbToHsv(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const d = max - min;
        let h = 0;
        if (d !== 0) {
            if (max === r) h = ((g - b) / d) % 6;
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
            if (h < 0) h += 360;
        }
        const s = max === 0 ? 0 : d / max;
        const v = max;
        return { h, s, v };
    }

    // Clasificación por COLOR (hue), no por posición. Un solo recuadro grande
    // detecta la luz del semáforo aunque esté chica (4 m) y aunque no quede
    // centrada: basta con que los píxeles iluminados de un color superen a los
    // de los otros dentro del recuadro.
    // Los rojos LED o desgastados salen anaranjados/rosados en la cámara:
    // se amplía el rango del ROJO hacia el naranja (hue 0-40) y al magenta
    // (300-360), y el AMARILLO real queda desde ~41 en adelante.
    const HUES = [
        { key: 'rojo',     min: 300, max: 360 },
        { key: 'rojo',     min: 0,   max: 40 },
        { key: 'amarillo', min: 41,  max: 70 },
        { key: 'verde',    min: 72,  max: 185 }
    ];

    function clasificarPixeles(sctx, x, y, w, h) {
        let data;
        try {
            data = sctx.getImageData(x, y, w, h).data;
        } catch (e) {
            return { cnt: { rojo: 0, amarillo: 0, verde: 0 }, lit: 0 };
        }
        const cnt = { rojo: 0, amarillo: 0, verde: 0 };
        let lit = 0;
        for (let i = 0; i < data.length; i += 8) {
            const hsv = rgbToHsv(data[i], data[i + 1], data[i + 2]);
            if (hsv.s >= 0.18 && hsv.v >= 0.18) {
                lit++;
                const hh = (hsv.h + 360) % 360;
                for (const b of HUES) {
                    if (hh >= b.min && hh < b.max) { cnt[b.key]++; break; }
                }
            }
        }
        return { cnt, lit };
    }

    // Fase del semáforo = color con más píxeles encendidos (si hay suficientes).
    function fasePorConteo(cnt, minimo) {
        const total = cnt.rojo + cnt.amarillo + cnt.verde;
        if (total < minimo) return null;
        // Un rojo con píxeles anaranjados se apoya en el 40% del amarillo para
        // compensar el tinte de los rojos LED/desgastados (sin robarle el turno a un AMARILLO de verdad que venga solo).
        const puntaje = {
            rojo: cnt.rojo + cnt.amarillo * 0.4,
            amarillo: cnt.amarillo,
            verde: cnt.verde
        };
        if (puntaje.rojo >= puntaje.amarillo) return puntaje.rojo >= puntaje.verde ? 'rojo' : 'verde';
        return puntaje.amarillo >= puntaje.verde ? 'amarillo' : 'verde';
    }

    function agregarLog(mensaje) {
        const hora = new Date().toLocaleTimeString();
        eventLog.unshift(`[${hora}] ${mensaje}`);
        if (eventLog.length > 20) eventLog.pop();
        logBox.innerHTML = eventLog.join('<br>');
    }

    // Duración promedio (ms) de una fase, a partir de las últimas observaciones
    function medirFase(fase) {
        const a = historialDuraciones[fase] || [];
        if (!a.length) return 0;
        return a.reduce((x, y) => x + y, 0) / a.length;
    }

    // Segundos con hasta 3 decimales y coma decimal (formato de visualización)
    function fmtSeg(ms) {
        return (ms / 1000).toFixed(3).replace('.', ',');
    }

    // Actualiza los contadores en vivo (chips con los segundos medidos por color)
    const mapaMedidaId = { rojo: 'medRojo', amarillo: 'medAmarillo', verde: 'medVerde' };
    function actualizarMedidas() {
        ['rojo', 'amarillo', 'verde'].forEach(k => {
            const ms = medirFase(k);
            document.getElementById(mapaMedidaId[k]).textContent = ms ? fmtSeg(ms) + ' s' : '--';
        });
    }

    // ===== Zoom =====
    // Se agranda solo la VISTA (video) para encuadrar fácil. El recuadro de
    // detección y el muestreo quedan FIJOS: el zoom no descoloca ni baja la
    // precisión de la zona.
    function aplicarZoomVista() {
        video.style.transform = 'scale(' + zoomActual + ')';
        actualizarNivelZoom();
    }

    function cambiarZoom(dir) {
        if (trackZoom) {
            const paso = dir > 0 ? zoomPaso : -zoomPaso;
            const nv = Math.min(zoomMax, Math.max(zoomMin, zoomActual + paso));
            trackZoom.applyConstraints({ advanced: [{ zoom: nv }] }).then(() => {
                zoomActual = nv;
                aplicarZoomVista();
            }).catch(() => {});
        } else {
            zoomActual = Math.min(3, Math.max(1, +(zoomActual + dir * 0.5).toFixed(1)));
            aplicarZoomVista();
        }
    }

    function actualizarNivelZoom() {
        const enMax = zoomActual >= limiteZoom();
        document.getElementById('zoomNivel').textContent = '×' + zoomActual.toFixed(1) + (enMax ? ' máx' : '');
    }

    // Cambia el tamaño del recuadro de detección (pequeña / mediana / grande)
    function cambiarTamanoZona() {
        nivelZona = (nivelZona + 1) % TAMANOS_ZONA.length;
        document.getElementById('btnZona').textContent = '⟦⟧ ' + NOMBRES_ZONA[nivelZona];
    }

    function limiteZoom() {
        return trackZoom ? Math.min(zoomMax, Math.max(zoomMin, 1) * 2.5) : 3;
    }

    // Auto-zoom: agranda la vista cuando la luz de la guía es muy pequeña
    // (p. ej. un semáforo a 4 m). Un paso cada ~350ms hasta que la luz tenga
    // tamaño suficiente o se llegue al máximo. Los botones +/− siguen estando.
    function autoAcercar(litPixeles, guiaPixeles) {
        if (!litPixeles) return;
        if (appState !== 'calibrando' && appState !== 'esperando_fin_verde') return;
        const ahora = Date.now();
        if (ahora - ultimoAutoZoom < 350) return;
        if (litPixeles >= guiaPixeles * 0.02) return;
        const limite = limiteZoom();
        if (zoomActual >= limite) {
            document.getElementById('zoomNivel').textContent = '×' + zoomActual.toFixed(1) + ' máx';
            return;
        }
        if (trackZoom) {
            const paso = Math.max(0.2, (zoomMax - zoomMin) / 20);
            const nv = Math.min(zoomMax, limite, zoomActual + paso);
            trackZoom.applyConstraints({ advanced: [{ zoom: nv }] }).then(() => {
                zoomActual = nv;
                aplicarZoomVista();
            }).catch(() => {});
        } else {
            zoomActual = Math.min(3, +(zoomActual + 0.3).toFixed(1));
            aplicarZoomVista();
        }
        ultimoAutoZoom = ahora;
    }

    async function iniciar() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
            });
            video.srcObject = stream;
            await video.play();

            // Zoom nativo (constraint 'zoom') si existe; si no, zoom de pantalla (CSS)
            try {
                const track = stream.getVideoTracks()[0];
                const caps = track.getCapabilities ? track.getCapabilities() : {};
                if (caps.zoom) {
                    trackZoom = track;
                    zoomMin = caps.zoom.min;
                    zoomMax = caps.zoom.max;
                    zoomPaso = caps.zoom.step || Math.max(0.1, (zoomMax - zoomMin) / 10);
                    zoomActual = caps.zoom.current != null ? caps.zoom.current : zoomMin;
                } else {
                    trackZoom = null;
                    zoomActual = 1;
                }
                aplicarZoomVista();
                document.getElementById('zoomBtns').style.display = 'flex';
            } catch (e) {}

            document.getElementById('btnStop').disabled = false;
            resultadoCard.style.display = 'none';

            historialFase = [];
            faseConfirmadaActual = null;
            inicioTransicion = null;
            faseAncla = null;
            tAncla = null;
            faseActual = null;
            inicioFaseActual = null;
            duracionesFase = {};
            ordenCiclo = [];
            cicloCerrado = false;
            historialDuraciones = {};
            conteoFin = {};
            vecesAnclaVista = 0;
            ultimaDeteccion = Date.now();
            actualizarMedidas();
            appState = 'calibrando';

            statusBox.className = 'status status-calibrando';
            statusBox.innerText = '🔵 Apunta al semáforo y mantenlo quieto...';
            agregarLog('Cámara lista: esperando detectar el semáforo.');

            requestAnimationFrame(procesarFrame);
        } catch (err) {
            statusBox.className = 'status status-idle';
            statusBox.innerText = 'No se pudo acceder a la cámara: ' + err.message;
            agregarLog('Error: ' + err.message);
        }
    }

    function detener() {
        if (rafId) cancelAnimationFrame(rafId);
        if (stream) stream.getTracks().forEach(t => t.stop());
        appState = 'idle';
        statusBox.className = 'status status-idle';
        statusBox.innerText = 'Cámara detenida';
        agregarLog('Cámara detenida.');
        window.location.href = 'index.html';
    }

    function procesarFrame() {
        if (!video.videoWidth) {
            rafId = requestAnimationFrame(procesarFrame);
            return;
        }

        overlay.width = video.clientWidth;
        overlay.height = video.clientHeight;

        // Guía grande: un solo recuadro amplio. La luz no necesita quedar exacta:
        // se clasifica por color dentro de todo el recuadro.
        const dims = TAMANOS_ZONA[nivelZona];
        const guiaW = overlay.width * dims[0];
        const guiaH = overlay.height * dims[1];
        const guiaX = overlay.width / 2 - guiaW / 2;
        const guiaY = overlay.height / 2 - guiaH / 2;

        ctx.clearRect(0, 0, overlay.width, overlay.height);
        if (faseConfirmadaActual) {
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(guiaX, guiaY, guiaW, guiaH);
        }
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.strokeRect(guiaX, guiaY, guiaW, guiaH);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = 'bold 13px Arial';
        ctx.textAlign = 'left';
        ctx.fillText('ZONA DE DETECCIÓN', guiaX + 8, guiaY - 8);

        const sampleCanvas = procesarFrame.sampleCanvas || (procesarFrame.sampleCanvas = document.createElement('canvas'));
        sampleCanvas.width = video.videoWidth;
        sampleCanvas.height = video.videoHeight;
        const sctx = sampleCanvas.getContext('2d');
        sctx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);

        // El video usa object-fit:cover, así que se recorta para llenar el contenedor.
        // Hay que compensar ese recorte al mapear coordenadas de pantalla -> pixeles nativos.
        const escalaCover = Math.max(overlay.width / video.videoWidth, overlay.height / video.videoHeight);
        const anchoMostrado = video.videoWidth * escalaCover;
        const altoMostrado = video.videoHeight * escalaCover;
        const offsetX = (anchoMostrado - overlay.width) / 2;
        const offsetY = (altoMostrado - overlay.height) / 2;

        function pantallaANativo(px, py) {
            return {
                x: (px + offsetX) / escalaCover,
                y: (py + offsetY) / escalaCover
            };
        }

        function zonaEnPixeles() {
            const p1 = pantallaANativo(guiaX, guiaY);
            const p2 = pantallaANativo(guiaX + guiaW, guiaY + guiaH);
            return { x: p1.x, y: p1.y, w: p2.x - p1.x, h: p2.y - p1.y };
        }

        const z = zonaEnPixeles();
        const analisis = clasificarPixeles(sctx, z.x, z.y, z.w, z.h);

        zonaEls.rojo.className = 'zona' + (analisis.cnt.rojo > 0 ? ' on-rojo' : '');
        zonaEls.amarillo.className = 'zona' + (analisis.cnt.amarillo > 0 ? ' on-amarillo' : '');
        zonaEls.verde.className = 'zona' + (analisis.cnt.verde > 0 ? ' on-verde' : '');

        // Auto-zoom: si la luz ocupa muy poco de la guía, agrandar la vista (zoom
        // óptico si existe, si no escalado de pantalla). Hasta que la luz tenga
        // tamaño suficiente o se llegue al máximo.
        autoAcercar(analisis.lit, z.w * z.h);

        const chipEstable = document.getElementById('chipEstable');
        if (faseConfirmadaActual) {
            chipEstable.innerText = `🟢 ${faseConfirmadaActual.toUpperCase()} · Estable`;
        } else if (appState === 'calibrando' && Date.now() - ultimaDeteccion > 4000) {
            chipEstable.innerText = '🟠 ¿No se ve la luz? Acerca el teléfono o toca +';
        } else {
            chipEstable.innerText = appState === 'calibrando' ? '🟠 Buscando semáforo…' : '🟡 Casi listo…';
        }

        const faseDetectada = fasePorConteo(analisis.cnt, 2);

        if (faseDetectada) {
            ultimaDeteccion = Date.now();
            historialFase.push(faseDetectada);
            if (historialFase.length > TAMANO_HISTORIAL) historialFase.shift();
            // Marcar el PRIMER frame en que el color se apartó del confirmado.
            // Si vuelve al confirmado (parpadeo), se limpia la marca pendiente.
            if (faseConfirmadaActual) {
                if (faseDetectada !== faseConfirmadaActual && inicioTransicion === null) {
                    inicioTransicion = ultimaDeteccion;
                } else if (faseDetectada === faseConfirmadaActual) {
                    inicioTransicion = null;
                }
            }
        } else {
            // Sin señal: vaciar la ventana para que la estabilidad requiera
            // reencuadrar limpio desde cero (evita arrastrar un color viejo).
            historialFase = [];
        }

        const todosIguales = historialFase.length === TAMANO_HISTORIAL && historialFase.every(f => f === historialFase[0]);
        const faseEstable = todosIguales ? historialFase[0] : null;

        if (faseEstable && faseEstable !== faseConfirmadaActual) {
            const ahora = Date.now();
            // Instante real del cambio: el primer frame que mostró el nuevo
            // color, +1 frame (≈33ms) porque la cámara ve el cambio ~un frame
            // después de que ocurre. Así la imagen no va adelantada ni atrasada.
            const tTransicion = inicioTransicion !== null && faseAncla !== null
                ? Math.min(ahora, inicioTransicion + 33)
                : ahora;
            inicioTransicion = null;

            // Anti-temblor: ignorar cambios que duren menos de 0.8s. Son
            // glitches por mover la cámara (la luz sale y vuelve a la franja)
            // y no representan un cambio real de fase del semáforo.
            const durActual = faseAncla === null ? 0 : tTransicion - inicioFaseActual;
            if (faseAncla !== null && durActual < 800) {
                if (ahora - ultimoGlitch > 2500) {
                    ultimoGlitch = ahora;
                    agregarLog('⚠️ Señal inestable: mantén el semáforo quieto.');
                }
            } else {
                faseConfirmadaActual = faseEstable;

                if (faseAncla === null) {
                    // Primer color detectado al abrir: queda como referencia del ciclo
                    faseAncla = faseEstable;
                    tAncla = tTransicion;
                    faseActual = faseEstable;
                    inicioFaseActual = tTransicion;
                    ordenCiclo = [faseEstable];
                    vecesAnclaVista = 1;
                    agregarLog(`Color de referencia: ${faseEstable.toUpperCase()}`);
                } else {
                    // Transición: la fase terminada termina en este instante
                    manejarTransicion(faseActual, inicioFaseActual, faseEstable, tTransicion);
                    faseActual = faseEstable;
                    inicioFaseActual = tTransicion;
                    // Regresó la luz con la que empezamos: se observó la vuelta
                    // completa y esa luz vuelve a medirse completa.
                    if (faseEstable === faseAncla && !cicloCerrado) {
                        vecesAnclaVista++;
                        if (vecesAnclaVista >= 2) cerrarCiclo();
                    }
                }
            }
        }

        rafId = requestAnimationFrame(procesarFrame);
    }

    function manejarTransicion(faseTerminada, inicioFase, nuevaFase, ahora) {
        if (appState === 'sincronizado') return;

        const dur = ahora - inicioFase;
        const esParcial = inicioFase === tAncla; // la fase que era el color de referencia: vimos su final pero no su inicio

        duracionesFase[faseTerminada] = dur;
        if (!esParcial) {
            (historialDuraciones[faseTerminada] = historialDuraciones[faseTerminada] || []).push(dur);
            if (historialDuraciones[faseTerminada].length > 8) historialDuraciones[faseTerminada].shift();
        }
        if (!ordenCiclo.includes(faseTerminada)) ordenCiclo.push(faseTerminada);
        conteoFin[faseTerminada] = (conteoFin[faseTerminada] || 0) + 1;
        actualizarMedidas();

        agregarLog(`Transición → ${nuevaFase.toUpperCase()} (${faseTerminada.toUpperCase()} ${fmtSeg(dur)} s)`);

        // Cierre del ciclo: la luz de referencia volvió -> vuelta completa.
        // (Se refuerza con un fallback genérico para ciclos raros.)
        if (!cicloCerrado) {
            const distintas = ['verde', 'amarillo', 'rojo'].filter(k => conteoFin[k]).length;
            if (distintas >= 2 && conteoFin[faseTerminada] >= 2) {
                cerrarCiclo();
            }
        }

        // Sincronizar cuando la luz CAMBIA a VERDE con el ciclo ya completo:
        // ese instante es el inicio exacto del verde real. Al volver a la app el
        // ciclo arranca justo ahí (no hay que esperar a que termine el verde).
        if (nuevaFase === 'verde' && !esParcial && cicloCerrado) {
            dispararSincronizacion(ahora);
        }
    }

    function cerrarCiclo() {
        if (cicloCerrado) return;
        cicloCerrado = true;
        mostrarResultado(duracionesFase);
        agregarLog('🔄 Ciclo completo: la luz de referencia volvió. Sincronizando al próximo cambio de luz...');
        appState = 'esperando_fin_verde';
        statusBox.className = 'status status-esperando';
        statusBox.innerText = '🟡 Ciclo completo. Sincroniza cuando cambie a VERDE...';
    }

    function mostrarResultado(duraciones) {
        resultadoCard.style.display = 'block';
        const mapaFases = { verde: 'tVerde', amarillo: 'tAmarillo', rojo: 'tRojo' };

        const orden = [];
        Object.keys(duraciones).forEach(k => { if (!orden.includes(k)) orden.push(k); });
        if (orden.includes('verde')) {
            while (orden[0] !== 'verde') orden.push(orden.shift());
        }

        let filas = '';
        const config = { tVerde: 0, tAmarillo: 0, tRojo: 0, order: orden };
        orden.forEach(k => {
            const seg = medirFase(k) / 1000;
            const s = Math.round(seg * 1000) / 1000;
            if (mapaFases[k]) config[mapaFases[k]] = s;
            filas += `<tr><td>${k.toUpperCase()}</td><td>${fmtSeg(seg * 1000)} s</td></tr>`;
        });
resultadoTabla.innerHTML = `<table>${filas}</table>`;
        if (copiableBox) copiableBox.innerText = JSON.stringify(config, null, 2);
    }

    function dispararSincronizacion(timestamp) {
        appState = 'sincronizado';
        statusBox.className = 'status status-sync';
        const hora = new Date(timestamp).toLocaleTimeString();
        statusBox.innerText = `✅ Sincronizado en VERDE a las ${hora}`;
        agregarLog(`>>> SINCRONIZACIÓN DISPARADA a las ${hora} <<<`);

        if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
        try {
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.value = 0.3;
            osc.connect(gain).connect(actx.destination);
            osc.start();
            osc.stop(actx.currentTime + 0.15);
        } catch (e) {}

        aplicarConfigYVolver(timestamp);
    }

    // Guarda la config medida por la cámara (tiempos + orden) y regresa a la
    // vista simple de la app (index.html) ya sincronizada en VERDE.
    function aplicarConfigYVolver(timestamp) {
        const mapaFases = { verde: 'tVerde', amarillo: 'tAmarillo', rojo: 'tRojo' };
        const prev = JSON.parse(localStorage.getItem('parametrosApp') || '{}');
        const params = {
            tVerde: prev.tVerde,
            tAmarillo: prev.tAmarillo,
            tRojo: prev.tRojo,
            tFlecha: prev.tFlecha || '15',
            tBajada: prev.tBajada || '55'
        };

        // El ciclo debe comenzar en VERDE (momento de la sincronización)
        const orden = [];
        Object.keys(duracionesFase).forEach(k => { if (!orden.includes(k)) orden.push(k); });
        if (orden.includes('verde')) {
            while (orden[0] !== 'verde') orden.push(orden.shift());
        }

        // Valores con hasta 3 decimales (parseFloat en la app) para minimizar el
        // error acumulado por ciclo. Los semáforos suelen ser segundos enteros,
        // así que calmamos los "casi enteros" y dejamos el resto con milisegundos.
        Object.keys(duracionesFase).forEach(k => {
            if (mapaFases[k]) params[mapaFases[k]] = medirFase(k) / 1000;
        });
        cicloVueltoEntero(params);

        localStorage.setItem('parametrosApp', JSON.stringify(params));
        localStorage.setItem('phaseOrder', JSON.stringify(orden));
        localStorage.setItem('syncTime', String(timestamp));
        localStorage.setItem('modoSimplificado', 'true');
        localStorage.setItem('valoresBloqueados', 'true');
        localStorage.setItem('configActualIdApp', '');
        localStorage.setItem('pausado', 'false');

        setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    }

    // Ajusta cada fase a precisión de milisegundo (hasta 3 decimales) para que
    // el ciclo no arrastre error acumulado. Si una fase quedó casi entera
    // (los semáforos suelen ser segundos enteros exactos) la deja en el entero.
    // Nada se reescala: cada luz se guarda tal como se midió.
    function cicloVueltoEntero(params) {
        ['tVerde', 'tAmarillo', 'tRojo', 'tFlecha', 'tBajada'].forEach(k => {
            const s = Number(params[k]) || 0;
            if (s <= 0) return;
            const entero = Math.round(s);
            params[k] = (Math.abs(entero - s) < 0.12) ? entero : Math.round(s * 1000) / 1000;
        });
    }

    // La cámara arranca sola al abrir la página (la acción principal de la app)
    iniciar();
</script>
