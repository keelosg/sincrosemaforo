<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo Calibración 3 Zonas</title>
<style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    html, body { height: 100%; }
    body { background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* ===== Zona superior: cámara, ocupa el espacio restante (~2/3) ===== */
    .camara-zone { flex: 2 1 0; min-height: 0; position: relative; background: #000; }
    .video-wrap { position: relative; width: 100%; height: 100%; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    h2 { position: absolute; top: 8px; left: 12px; right: 12px; margin: 0; font-size: 0.95em; text-shadow: 0 1px 4px rgba(0,0,0,0.9); z-index: 2; }
    .sub { position: absolute; top: 32px; left: 12px; right: 12px; font-size: 0.7em; color: #ddd; text-shadow: 0 1px 4px rgba(0,0,0,0.9); z-index: 2; }

    /* ===== Zona inferior: controles, fijada a ~1/3 de la pantalla con scroll ===== */
    .controles-zone { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 10px 12px; }

    .card { background: #1e1e1e; padding: 10px; border-radius: 10px; margin-top: 8px; text-align: left; }
    button { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 0.9em; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row button { margin-top: 0; }
    .btn-start { background: #00e676; color: #000; }
    .btn-stop { background: #d32f2f; color: #fff; }
    .btn-start:disabled, .btn-stop:disabled { opacity: 0.4; }
    .status { margin-top: 8px; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; font-size: 0.9em; }
    .status-idle { background: #2a2a2a; color: #aaa; }
    .status-calibrando { background: rgba(41,121,255,0.15); color: #2979ff; }
    .status-esperando { background: rgba(255,193,7,0.15); color: #ffc107; }
    .status-sync { background: rgba(0,230,118,0.15); color: #00e676; }
    .zonas { display: flex; gap: 6px; margin-top: 8px; }
    .zona { flex: 1; text-align: center; padding: 6px; border-radius: 8px; background: #2a2a2a; }
    .zona .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-bottom: 3px; background: #333; }
    .zona.on-rojo .dot { background: #d32f2f; box-shadow: 0 0 8px #d32f2f; }
    .zona.on-amarillo .dot { background: #fbc02d; box-shadow: 0 0 8px #fbc02d; }
    .zona.on-verde .dot { background: #388e3c; box-shadow: 0 0 8px #388e3c; }
    .zona .lbl { font-size: 0.65em; color: #888; display: block; }
    .log { font-size: 0.68em; color: #888; margin-top: 6px; max-height: 70px; overflow-y: auto; text-align: left; line-height: 1.4; }
    .resultado table { width: 100%; border-collapse: collapse; font-size: 0.82em; margin-top: 6px; }
    .resultado td { padding: 4px; border-bottom: 1px solid #333; }
    .resultado td:first-child { font-weight: bold; }
    .nota { font-size: 0.68em; color: #666; margin-top: 8px; }
    .copiable { background: #2a2a2a; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 0.72em; margin-top: 6px; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="camara-zone">
    <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <h2>🔄 Calibración por zonas</h2>
    <div class="sub">Encuadra el semáforo completo dentro de las 3 franjas guía</div>
</div>

<div class="controles-zone">
    <div class="zonas">
        <div class="zona" id="zonaRojo"><div class="dot"></div><span class="lbl">ROJO</span></div>
        <div class="zona" id="zonaAmarillo"><div class="dot"></div><span class="lbl">AMARILLO</span></div>
        <div class="zona" id="zonaVerde"><div class="dot"></div><span class="lbl">VERDE</span></div>
    </div>

    <div class="card btn-row">
        <button id="btnStart" class="btn-start" onclick="iniciar()">▶️ Iniciar</button>
        <button id="btnStop" class="btn-stop" onclick="detener()" disabled>⏹️ Cancelar</button>
    </div>

    <div id="status" class="status status-idle">Cámara apagada</div>

    <div class="card">
        <label style="font-size:0.75em;color:#aaa;">Transiciones detectadas</label>
        <div class="log" id="log">Sin eventos todavía.</div>
    </div>

    <div id="resultadoCard" class="card" style="display:none;">
        <label style="font-size:0.75em;color:#aaa;">Ciclo calculado (config para tu app)</label>
        <div class="resultado" id="resultadoTabla"></div>
        <div class="nota">"Amarillo" incluye la superposición verde+amarillo y el breve apagón antes del rojo — queda fuera de la ventana segura, igual que en tu app.</div>
        <div class="copiable" id="copiable"></div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const statusBox = document.getElementById('status');
    const logBox = document.getElementById('log');
    const resultadoCard = document.getElementById('resultadoCard');
    const resultadoTabla = document.getElementById('resultadoTabla');
    const copiableBox = document.getElementById('copiable');
    const zonaEls = { rojo: document.getElementById('zonaRojo'), amarillo: document.getElementById('zonaAmarillo'), verde: document.getElementById('zonaVerde') };

    let stream = null;
    let rafId = null;
    let historialFase = [];
    const TAMANO_HISTORIAL = 6;
    let faseConfirmadaActual = null;

    // Estados: 'idle' | 'calibrando' | 'esperando_fin_verde' | 'sincronizado'
    let appState = 'idle';

    // Detección de ciclo por color de referencia:
    // 1. Al abrir la cámara se fija el primer color detectado (faseAncla).
    // 2. El ciclo se completa cuando ese color vuelve a aparecer.
    // 3. Se sincroniza cuando termina el VERDE.
    let faseAncla = null;          // color de referencia (el primero detectado)
    let tAncla = null;             // instante de la primera detección (referencia parcial)
    let faseActual = null;         // fase actual (avanza con transiciones estables)
    let inicioFaseActual = null;   // instante en que empezó la fase actual
    let duracionesFase = {};       // duración (ms) por fase del último segmento completo
    let ordenCiclo = [];           // orden en que se observaron las fases
    let cicloCerrado = false;      // ya se observó el color de referencia volver

    const eventLog = [];

    // Umbrales de "encendido" por zona (independientes del hue: solo brillo+saturación)
    const UMBRAL_SAT = 0.30;
    const UMBRAL_VAL = 0.30;

    function rgbToHsv(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const d = max - min;
        let h = 0;
        if (d !== 0) {
            if (max === r) h = ((g - b) / d) % 6;
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
            if (h < 0) h += 360;
        }
        const s = max === 0 ? 0 : d / max;
        const v = max;
        return { h, s, v };
    }

    function muestrearZona(sctx, x, y, w, h) {
        let rSum = 0, gSum = 0, bSum = 0, n = 0;
        let data;
        try {
            data = sctx.getImageData(x, y, w, h).data;
        } catch (e) {
            return { h: 0, s: 0, v: 0 };
        }
        for (let i = 0; i < data.length; i += 16) {
            rSum += data[i]; gSum += data[i + 1]; bSum += data[i + 2];
            n++;
        }
        if (n === 0) return { h: 0, s: 0, v: 0 };
        return rgbToHsv(rSum / n, gSum / n, bSum / n);
    }

    // Regla de bucket: si rojo encendido -> 'rojo'. Si verde encendido y amarillo apagado -> 'verde'.
    // Cualquier otra combinación (amarillo solo, verde+amarillo superpuestos, o ambos apagados) -> 'amarillo'
    // (tramo de advertencia/transición, ya excluido de la ventana segura en tu app).
    function calcularFase(rojoOn, amarilloOn, verdeOn) {
        if (rojoOn) return 'rojo';
        if (verdeOn && !amarilloOn) return 'verde';
        return 'amarillo';
    }

    function agregarLog(mensaje) {
        const hora = new Date().toLocaleTimeString();
        eventLog.unshift(`[${hora}] ${mensaje}`);
        if (eventLog.length > 20) eventLog.pop();
        logBox.innerHTML = eventLog.join('<br>');
    }

    async function iniciar() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
            });
            video.srcObject = stream;
            await video.play();

            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStop').disabled = false;
            resultadoCard.style.display = 'none';

            historialFase = [];
            faseConfirmadaActual = null;
            faseAncla = null;
            tAncla = null;
            faseActual = null;
            inicioFaseActual = null;
            duracionesFase = {};
            ordenCiclo = [];
            cicloCerrado = false;
            appState = 'calibrando';

            statusBox.className = 'status status-calibrando';
            statusBox.innerText = '🔵 Calibrando: observa el ciclo completo';
            agregarLog('Calibración iniciada.');

            requestAnimationFrame(procesarFrame);
        } catch (err) {
            statusBox.className = 'status status-idle';
            statusBox.innerText = 'Error al acceder a la cámara: ' + err.message;
        }
    }

    function detener() {
        if (rafId) cancelAnimationFrame(rafId);
        if (stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStop').disabled = true;
        appState = 'idle';
        statusBox.className = 'status status-idle';
        statusBox.innerText = 'Cámara apagada';
        agregarLog('Cámara detenida.');
    }

    function procesarFrame() {
        if (!video.videoWidth) {
            rafId = requestAnimationFrame(procesarFrame);
            return;
        }

        overlay.width = video.clientWidth;
        overlay.height = video.clientHeight;

        // Guía vertical: rectángulo alto en el centro, dividido en 3 franjas iguales
        const guiaW = overlay.width * 0.30;
        const guiaH = overlay.height * 0.65;
        const guiaX = overlay.width / 2 - guiaW / 2;
        const guiaY = overlay.height / 2 - guiaH / 2;
        const franjaH = guiaH / 3;

        ctx.clearRect(0, 0, overlay.width, overlay.height);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(guiaX, guiaY, guiaW, guiaH);
        ctx.beginPath();
        ctx.moveTo(guiaX, guiaY + franjaH); ctx.lineTo(guiaX + guiaW, guiaY + franjaH);
        ctx.moveTo(guiaX, guiaY + franjaH * 2); ctx.lineTo(guiaX + guiaW, guiaY + franjaH * 2);
        ctx.stroke();

        const sampleCanvas = procesarFrame.sampleCanvas || (procesarFrame.sampleCanvas = document.createElement('canvas'));
        sampleCanvas.width = video.videoWidth;
        sampleCanvas.height = video.videoHeight;
        const sctx = sampleCanvas.getContext('2d');
        sctx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);

        // El video usa object-fit:cover, así que se recorta para llenar el contenedor.
        // Hay que compensar ese recorte al mapear coordenadas de pantalla -> pixeles nativos.
        const escalaCover = Math.max(overlay.width / video.videoWidth, overlay.height / video.videoHeight);
        const anchoMostrado = video.videoWidth * escalaCover;
        const altoMostrado = video.videoHeight * escalaCover;
        const offsetX = (anchoMostrado - overlay.width) / 2;
        const offsetY = (altoMostrado - overlay.height) / 2;

        function pantallaANativo(px, py) {
            return {
                x: (px + offsetX) / escalaCover,
                y: (py + offsetY) / escalaCover
            };
        }

        function zonaEnPixeles(indice) {
            const p1 = pantallaANativo(guiaX, guiaY + franjaH * indice);
            const p2 = pantallaANativo(guiaX + guiaW, guiaY + franjaH * (indice + 1));
            return { x: p1.x, y: p1.y, w: p2.x - p1.x, h: p2.y - p1.y };
        }

        const zRojo = zonaEnPixeles(0);
        const zAmarillo = zonaEnPixeles(1);
        const zVerde = zonaEnPixeles(2);

        const hsvRojo = muestrearZona(sctx, zRojo.x, zRojo.y, zRojo.w, zRojo.h);
        const hsvAmarillo = muestrearZona(sctx, zAmarillo.x, zAmarillo.y, zAmarillo.w, zAmarillo.h);
        const hsvVerde = muestrearZona(sctx, zVerde.x, zVerde.y, zVerde.w, zVerde.h);

        const rojoOn = hsvRojo.s >= UMBRAL_SAT && hsvRojo.v >= UMBRAL_VAL;
        const amarilloOn = hsvAmarillo.s >= UMBRAL_SAT && hsvAmarillo.v >= UMBRAL_VAL;
        const verdeOn = hsvVerde.s >= UMBRAL_SAT && hsvVerde.v >= UMBRAL_VAL;

        zonaEls.rojo.className = 'zona' + (rojoOn ? ' on-rojo' : '');
        zonaEls.amarillo.className = 'zona' + (amarilloOn ? ' on-amarillo' : '');
        zonaEls.verde.className = 'zona' + (verdeOn ? ' on-verde' : '');

        const faseDetectada = calcularFase(rojoOn, amarilloOn, verdeOn);

        historialFase.push(faseDetectada);
        if (historialFase.length > TAMANO_HISTORIAL) historialFase.shift();

        const todosIguales = historialFase.length === TAMANO_HISTORIAL && historialFase.every(f => f === historialFase[0]);
        const faseEstable = todosIguales ? historialFase[0] : null;

        if (faseEstable && faseEstable !== faseConfirmadaActual) {
            const ahora = Date.now();
            faseConfirmadaActual = faseEstable;

            if (faseAncla === null) {
                // Primer color detectado al abrir: queda como referencia del ciclo
                faseAncla = faseEstable;
                tAncla = ahora;
                faseActual = faseEstable;
                inicioFaseActual = ahora;
                ordenCiclo = [faseEstable];
                agregarLog(`Color de referencia: ${faseEstable.toUpperCase()}`);
            } else {
                // Transición: la fase terminada termina en este instante
                manejarTransicion(faseActual, inicioFaseActual, faseEstable, ahora);
                faseActual = faseEstable;
                inicioFaseActual = ahora;
            }
        }

        rafId = requestAnimationFrame(procesarFrame);
    }

    function manejarTransicion(faseTerminada, inicioFase, nuevaFase, ahora) {
        if (appState === 'sincronizado') return;

        const dur = ahora - inicioFase;
        duracionesFase[faseTerminada] = dur;
        if (!ordenCiclo.includes(faseTerminada)) ordenCiclo.push(faseTerminada);

        agregarLog(`Transición → ${nuevaFase.toUpperCase()} (${faseTerminada.toUpperCase()} ${Math.round(dur / 1000)}s)`);

        // Sincronizar al terminar el VERDE: el verde que acaba de terminar
        // comenzó en inicioFase — ese instante alinea la app con el ciclo real.
        // (Se descarta el verde inicial si fue el color de referencia: su inicio
        // es parcial porque no vimos cuándo empezó realmente.)
        if (faseTerminada === 'verde' && inicioFase !== tAncla) {
            if (appState === 'calibrando') {
                if (cicloCerrado) {
                    dispararSincronizacion(inicioFase);
                } else {
                    agregarLog('VERDE terminó pero aún no se completó el ciclo; esperando.');
                }
            } else if (appState === 'esperando_fin_verde') {
                dispararSincronizacion(inicioFase);
            }
            return;
        }

        // Cuando el color de referencia vuelve → ciclo completo
        if (nuevaFase === faseAncla && !cicloCerrado) {
            cicloCerrado = true;
            mostrarResultado(duracionesFase);
            agregarLog('✅ Ciclo completo calculado. Esperando que termine el VERDE...');
            appState = 'esperando_fin_verde';
            statusBox.className = 'status status-esperando';
            statusBox.innerText = '🟡 Ciclo aprendido. Sincronizaré cuando termine el VERDE...';
        }
    }

    function mostrarResultado(duraciones) {
        resultadoCard.style.display = 'block';
        const mapaFases = { verde: 'tVerde', amarillo: 'tAmarillo', rojo: 'tRojo' };

        const orden = [];
        Object.keys(duraciones).forEach(k => { if (!orden.includes(k)) orden.push(k); });
        if (orden.includes('verde')) {
            while (orden[0] !== 'verde') orden.push(orden.shift());
        }

        let filas = '';
        const config = { tVerde: 0, tAmarillo: 0, tRojo: 0, order: orden };
        orden.forEach(k => {
            const s = Math.round(duraciones[k] / 1000);
            if (mapaFases[k]) config[mapaFases[k]] = s;
            filas += `<tr><td>${k.toUpperCase()}</td><td>${s}s</td></tr>`;
        });
        resultadoTabla.innerHTML = `<table>${filas}</table>`;
        copiableBox.innerText = JSON.stringify(config, null, 2);
    }

    function dispararSincronizacion(timestamp) {
        appState = 'sincronizado';
        statusBox.className = 'status status-sync';
        const hora = new Date(timestamp).toLocaleTimeString();
        statusBox.innerText = `✅ Sincronizado en VERDE a las ${hora}`;
        agregarLog(`>>> SINCRONIZACIÓN DISPARADA a las ${hora} <<<`);

        if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
        try {
            const actx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.value = 0.3;
            osc.connect(gain).connect(actx.destination);
            osc.start();
            osc.stop(actx.currentTime + 0.15);
        } catch (e) {}

        aplicarConfigYVolver(timestamp);
    }

    // Guarda la config medida por la cámara (tiempos + orden) y regresa a la
    // vista simple de la app (index.html) ya sincronizada en VERDE.
    function aplicarConfigYVolver(timestamp) {
        const mapaFases = { verde: 'tVerde', amarillo: 'tAmarillo', rojo: 'tRojo' };
        const prev = JSON.parse(localStorage.getItem('parametrosApp') || '{}');
        const params = {
            tVerde: prev.tVerde,
            tAmarillo: prev.tAmarillo,
            tRojo: prev.tRojo,
            tFlecha: prev.tFlecha || '15',
            tBajada: prev.tBajada || '55'
        };

        // El ciclo debe comenzar en VERDE (momento de la sincronización)
        const orden = [];
        Object.keys(duracionesFase).forEach(k => { if (!orden.includes(k)) orden.push(k); });
        if (orden.includes('verde')) {
            while (orden[0] !== 'verde') orden.push(orden.shift());
        }

        Object.keys(duracionesFase).forEach(k => {
            if (mapaFases[k]) params[mapaFases[k]] = Math.round(duracionesFase[k] / 1000);
        });
        if (params.tVerde === undefined || params.tVerde === null || params.tVerde === '') params.tVerde = prev.tVerde || 0;
        if (params.tAmarillo === undefined || params.tAmarillo === null || params.tAmarillo === '') params.tAmarillo = prev.tAmarillo || 0;
        if (params.tRojo === undefined || params.tRojo === null || params.tRojo === '') params.tRojo = prev.tRojo || 0;

        localStorage.setItem('parametrosApp', JSON.stringify(params));
        localStorage.setItem('phaseOrder', JSON.stringify(orden));
        localStorage.setItem('syncTime', String(timestamp));
        localStorage.setItem('modoSimplificado', 'true');
        localStorage.setItem('valoresBloqueados', 'true');
        localStorage.setItem('configActualIdApp', '');

        setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    }
</script>
</body>
</html>
